name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes app scripts tests
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t stock-rater .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8000:8000 -e DATA_SOURCE=sample stock-rater
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/rating/AAPL | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ticker']=='AAPL' and d['score'] is not None, d"
          curl -sf localhost:8000/api/rating/BTC-USD | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['asset_type']=='crypto', d"
          curl -sf "localhost:8000/api/search?q=apple" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d[0]['ticker']=='AAPL', d"
          curl -sf localhost:8000/ | grep -q '<div id="root">'
