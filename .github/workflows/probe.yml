name: Probe live data sources

on:
  push:
    paths:
      - backend/scripts/probe_live_sources.py
      - .github/workflows/probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/probe_live_sources.py
