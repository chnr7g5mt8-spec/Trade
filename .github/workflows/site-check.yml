name: Check deployed site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://stock-rater-n7st.onrender.com

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python backend/scripts/check_site.py "${{ inputs.url || 'https://stock-rater-n7st.onrender.com' }}"
