name: Track record (backtest)

# At past quarter ends, re-rates the 400 largest US companies *at that time*
# using only information available then, and compares ratings with the next
# 12 months' returns. Writes backend/app/data/backtest.json, shown in the app.
on:
  schedule:
    - cron: "41 7 5 1,4,7,10 *"  # quarterly, after the benchmark refresh
  workflow_dispatch:
    inputs:
      size:
        description: "Companies rated at each start date (largest at that date)"
        default: "400"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-scripts.txt
      - run: python backend/scripts/backtest.py --size "${{ inputs.size || 400 }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update track record (backtest)"
          git pull --rebase
          git push
