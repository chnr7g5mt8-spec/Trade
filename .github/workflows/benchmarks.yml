name: Refresh industry benchmarks

# Rebuilds backend/app/data/benchmarks.json from real Yahoo Finance data:
# up to 50 of the largest US-listed companies in each Yahoo industry.
on:
  schedule:
    - cron: "17 6 2 * *"  # monthly, on the 2nd
  workflow_dispatch:
    inputs:
      limit_industries:
        description: "Only this many industries (0 = all; small numbers for a quick test)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-scripts.txt
      - run: python backend/scripts/build_benchmarks.py --limit-industries "${{ inputs.limit_industries || 0 }}"
      - name: Commit benchmarks
        if: ${{ !inputs.limit_industries || inputs.limit_industries == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/benchmarks.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh industry benchmarks"
          git pull --rebase
          git push
